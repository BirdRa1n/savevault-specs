name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate schemas, examples and test vectors
        run: npm run check

      - name: Signing vectors are reproducible
        run: |
          node scripts/gen-registry-vectors.mjs
          git diff --exit-code -- registry/
